<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradCollege" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#gradCollege)"/>
  <!-- Laurel wreath -->
  <path d="M 30,76 C 24,62 26,45 36,34 C 34,44 38,55 44,62" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 90,76 C 96,62 94,45 84,34 C 86,44 82,55 76,62" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Graduation cap base / skullcap -->
  <path d="M 40,64 L 40,75 C 40,82 60,86 60,86 C 60,86 80,82 80,75 L 80,64 Z" fill="#1e293b" opacity="0.9"/>
  <!-- Mortarboard Diamond Top -->
  <polygon points="60,36 94,52 60,68 26,52" fill="url(#gradGold)" stroke="#b45309" stroke-width="2"/>
  <!-- Button on cap -->
  <circle cx="60" cy="52" r="3.5" fill="#78350f"/>
  <!-- Tassel ribbon -->
  <path d="M 60,52 Q 78,56 82,72" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="82" cy="74" r="2.5" fill="#fef08a"/>
</svg>
